name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate macOS scripts and app metadata
        run: |
          zsh -n scripts/*.command scripts/*.zsh "DeepSeek Harness.app/Contents/MacOS/DeepSeekHarnessWeb"
          plutil -lint "DeepSeek Harness.app/Contents/Info.plist"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem windows -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$_" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
